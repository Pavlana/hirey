# Copy to ~/.config/inter_prep/settings.toml and fill in absolute paths.
# That fixed per-user path is found from any checkout, dev3 worktree, launchd job or app,
# without environment variables.
#
# Lookup order: $INTERPREP_SETTINGS, then config/settings.toml in the checkout (gitignored;
# a per-checkout override), then ~/.config/inter_prep/settings.toml.
# Each key can also be set with an environment variable, which wins over the file:
#   PREP_GETJO_DB, PREP_DB, PREP_PRIVATE_DIR, PREP_DASHBOARD_PORT, PREP_WEEKLY_TARGET,
#   PREP_NO_RESPONSE_DAYS, PREP_RESEARCH_MAX_AGE_DAYS, PREP_ASSISTANT_TASK,
#   PREP_ASSISTANT_PROJECT, PREP_DEV3_BIN, PREP_PDF_PYTHON, PREP_FACTS_FILE
#
# Use absolute paths. The code runs from dev3 worktrees, so relative paths such as
# "../getjo" would point somewhere different in every worktree.

# getjo's database. Opened read-only; never written.
getjo_db = "/absolute/path/to/getjo/data/jobs.db"

# Optional. getjo's git working copy, read only: the Learn explainers' check compares the getjo code
# they quote with what is there now. Default: two folders above getjo_db, when that is a git checkout.
# getjo_repo = "/absolute/path/to/getjo"

# This project's database. Use an absolute path outside any worktree, e.g. the main
# checkout's data/ folder (gitignored). A relative path resolves against the repo root of
# the running checkout, and a worktree's data/ folder is deleted with the worktree.
prep_db = "/absolute/path/to/inter_prep/data/prep.db"

# Folder holding cv.md, notes/, sessions/, and the agent's companies/ and fit/ files. Never committed.
private_dir = "/absolute/path/to/inter_prep"

# Optional. Port of the local dashboard (python -m prep.web); it always binds to 127.0.0.1.
# dashboard_port = 8765

# Optional. Applications per week the dashboard's Pipeline page measures against.
# weekly_target = 10

# Optional. Days an application can sit in Applied with no stage change before it moves to
# No response automatically (checked on each dashboard request and by /today).
# no_response_days = 14

# Optional. A company profile older than this many days is researched again when another
# role at that company is queued (Redo on the card always researches again).
# research_max_age_days = 90

# Optional. A getjo job its last poll did not list for more than this many days reads
# "may be closed" in New offers and /today (needs getjo's last_seen column).
# stale_days = 3

# Optional. New offers scored at least this get a job brief queued for the agent in the
# background; any other offer gets one queued when its panel is first opened.
# brief_auto_min_score = 8

# Optional. The seq number of a long-running dev3 task acting as the Applications Assistant. When set,
# newly queued research / CV fit requests (Interested, or the card's buttons) are also sent to it
# as "/research <application id>" with `dev3 message`. Unset: requests wait for the next Claude
# session (SessionStart hook) or /today.
# assistant_task = 42
# Optional. That task's dev3 project id, passed as --project. Usually not needed: dev3 finds
# the task by its seq from the main checkout. Set it if several dev3 projects are in use and the
# message reaches the wrong one.
# assistant_project = "00000000-0000-0000-0000-000000000000"
# Optional. Absolute path to the dev3 CLI. Default: dev3 on PATH, else ~/.dev3.0/bin/dev3.
# dev3_bin = "/absolute/path/to/dev3"
# Optional. The seq number of a second long-running dev3 task, the Learn Assistant: each new message
# in the Learn page's Learn Assistant box is sent to it as "/learn-ask <card id> <message id>". Unset:
# messages wait for /learn-ask in any Claude session. assistant_project and dev3_bin apply to it too.
# prep_assistant_task = 43
# Optional routing of queued work to worker tasks, in a [workers] table at the END of this file (keys
# after a table header belong to it). research = <seq> sends company research, CV fit, tailored CVs,
# AI CV checks and job briefs to that standing dev3 task instead of assistant_task; thread messages
# always stay with assistant_task. comms = <seq> sends "Draft a reply" requests (/reply: drafts of
# replies to recruiters, follow-ups, thank-you notes) to a Comms worker; unset, they go to assistant_task.
# A list runs several workers in parallel (research = [44, 46]): each new item goes to the first one with
# nothing claimed or waiting, else round-robin; two workers never take the same item.
# Env PREP_WORKER_RESEARCH / PREP_WORKER_COMMS override ("44,46"; empty turns it off).
#   [workers]
#   research = 44
#   comms = 45

# Optional. Absolute path to a Python that has WeasyPrint (requirements.txt), for the PDF of each
# tailored CV. Needed when the skills run a Python without it, e.g. from a dev3 worktree: point it
# at the venv in the main checkout (docs/reference/cvs.md, "PDF").
# pdf_python = "/absolute/path/to/inter_prep/.venv/bin/python"

# Optional. The facts bank: true facts not in cv.md (template: cv-facts.example.md). Claims in a
# tailored CV may trace to cv.md or to this file; the AI check flags anything else. Default:
# cv-facts.md in private_dir.
# facts_file = "/absolute/path/to/inter_prep/cv-facts.md"

# Usage & cost page: Claude Code transcripts are read for token counts only (never message text).
# claude_projects_dir = "/Users/example/.claude/projects"   # absolute; default ~/.claude/projects
# coordinator_task = 3              # dev3 seq of the coordinator (tasks of dev3 type coordinator count anyway)
# context_warn_tokens = 300000      # context per turn above this reads "time to /compact"
# Dollars on the Usage tab are an estimate at Claude API list prices (not a subscription bill).
# Built-in prices for current models are in prep/prices.py. A [prices."<model id or prefix>"] table
# overrides them (longest prefix wins) or prices a model the list does not know; dollars per
# million tokens; cache_write is the 5-minute cache write, cache_write_1h defaults to cache_write.
# [prices."claude-example"]
# input = 1.0
# output = 5.0
# cache_read = 0.1
# cache_write = 1.25
# cache_write_1h = 2.0
