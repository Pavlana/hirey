<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<!--
  A CV as a PDF (prep/cvpdf.py fills in the title and the body: cvpdf.cv_layout's escaped HTML, a
  header, then one full-width column of sections). Real text in a system sans (Helvetica Neue, Arial
  fallback; no font file), selectable, ligatures off, no tables, images, headers or footers. The
  reading order is the HTML order: name, title, focus, contact, summary, skills, experience and
  the rest, education. Black on white; the name in mint (#3eb489), the section headings and their rules in
  slate (#59656f). A4.
-->
<style>
:root { --name: #3eb489; --head: #59656f; --ink: #111; --text: #1e1e1e; --grey: #6b6b6b; }
@page { size: A4; margin: 14mm 15mm 14mm 15mm; }
html {
  font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  font-size: 9.5pt;
  line-height: 1.3;
  color: var(--text);
  font-variant-ligatures: none;
  font-kerning: normal;
}
body { margin: 0; }
/* the header: name, title, focus and the contact block on the left; the summary text on the right */
.mast { margin: 0 0 12pt 0; display: grid; grid-template-columns: 37% 63%; }
.name {
  color: var(--name);
  font-weight: 700;
  font-size: 32pt;
  line-height: 0.88;
  letter-spacing: -0.04em;
  text-transform: uppercase;
  margin: 0;
  padding-top: 2pt;
}
.name span { display: block; }
.title, .focus { margin: 1pt 0 0 0; text-transform: uppercase; color: var(--ink); }
.title { margin-top: 7pt; font-weight: 700; }
.focus { word-spacing: 1.5pt; }
/* the summary starts level with the title line: the name's two lines (2 x 32pt x 0.88), its
   2pt padding and the title's 7pt margin */
.summary { padding-top: 65.3pt; }
.summary p { margin: 0 0 3pt 0; }
/* a summary written as list items: no bullet mark, each line starts with its bold lead-in; a
   wrapped line is indented under it */
.summary ul { margin: 0; }
.summary li { font-size: 9pt; margin: 0 0 2pt 0; padding-left: 8pt; text-indent: -8pt; }
.contact { margin: 5pt 0 0 0; font-size: 9pt; line-height: 1.3; color: var(--ink); white-space: nowrap; }
.note { margin: 3pt 0 0 0; color: var(--grey); }
/* a skills or education section never splits across pages: it moves whole to the next page */
.keep { break-inside: avoid; margin-break: discard; }
/* a skills group: its name, then its items on one line */
.skl { margin: 0 0 2pt 0; }
.block + .block { margin-top: 10pt; }
h3 {
  font-size: 10pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2pt;
  color: var(--head);
  margin: 0 0 5pt 0;
  padding-bottom: 1.5pt;
  border-bottom: 0.75pt solid var(--head);
  break-after: avoid;
}
h4 { font-size: 9.5pt; margin: 6pt 0 1pt 0; text-transform: uppercase; break-after: avoid; }
p { margin: 0 0 4pt 0; orphans: 2; widows: 2; }
/* a role: TITLE on the left, CITY / DATES at the right margin, then the company line, then its bullets */
.role { margin: 6pt 0 0 0; break-after: avoid; display: flex; justify-content: space-between; align-items: baseline; }
h3 + .role { margin-top: 0; }
.role strong { text-transform: uppercase; color: var(--head); }
/* a job or project title (a role with a company line) in the name's mint; a break (no company
   line) in the headings' slate */
.job strong { color: var(--name); }
.when { white-space: nowrap; margin-left: 12pt; text-align: right; text-transform: uppercase; color: var(--grey); }
.org { font-weight: 400; color: #3a3a3a; margin: 0 0 1pt 0; break-after: avoid; }
ul { margin: 1pt 0 4pt 0; padding-left: 0; list-style: none; }
/* the bullet is text in the line (hanging), so it is extracted with its item, not apart from it */
li { margin: 0 0 1pt 0; padding-left: 9pt; text-indent: -9pt; break-inside: avoid; }
.sections li::before { content: "•\2002"; }
/* bullets and paragraphs fill the line from margin to margin */
.sections li, .sections p:not(.role):not(.org):not(.skl) { text-align: justify; }
p:has(+ ul) { break-after: avoid; }
strong { font-weight: 700; color: var(--ink); }
a { color: var(--text); text-decoration: none; }
pre, code { font-family: inherit; white-space: pre-wrap; }
</style>
</head>
<body>
$body
</body>
</html>
