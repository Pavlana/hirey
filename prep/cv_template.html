<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<!--
  A CV as a PDF (prep/cvpdf.py fills in the title and the body: cvpdf.cv_layout's escaped HTML, a
  header, then a narrow and a wide column). Real text in a system sans (Helvetica Neue, Arial
  fallback; no font file), selectable, ligatures off, no tables, images, headers or footers. The
  reading order is the HTML order: name, title, focus, contact, narrow column, wide column. Black on
  white; deep pine (#233421, 13.9:1 on white) on the name, the section headings and their rules. A4.
-->
<style>
:root { --pine: #233421; --ink: #111; --text: #1e1e1e; --grey: #6b6b6b; }
@page { size: A4; margin: 14mm 15mm 14mm 15mm; }
html {
  font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  font-size: 9.5pt;
  line-height: 1.3;
  color: var(--text);
  font-variant-ligatures: none;
  font-kerning: normal;
}
body { margin: 0; }
/* the header: name, title, focus, contact in reading order; the grid puts the contact top right */
.mast { margin: 0 0 12pt 0; display: grid; grid-template-columns: 1fr auto; }
.mast > * { grid-column: 1; }
.name {
  grid-row: 1;
  color: var(--pine);
  font-weight: 700;
  font-size: 42pt;
  line-height: 0.86;
  letter-spacing: -0.05em;
  text-transform: uppercase;
  margin: 0;
  padding-top: 4pt;
}
.name span { display: block; }
.contact { grid-column: 2; grid-row: 1; align-self: end; white-space: nowrap; margin: 0 0 1pt 0; font-size: 9pt; line-height: 1.35; }
.title, .focus { margin: 1pt 0 0 0; text-transform: uppercase; color: var(--ink); }
.title { margin-top: 7pt; }
.focus { word-spacing: 1.5pt; }
.note { margin: 3pt 0 0 0; color: var(--grey); }
/* two columns: the narrow one floats left, the wide one runs beside it and on past it */
.side { float: left; width: 33%; }
.main { margin-left: 37%; }
/* a narrow-column section never splits across pages: it moves whole to the next page */
.side .block { break-inside: avoid; margin-break: discard; }
.block + .block { margin-top: 10pt; }
h3 {
  font-size: 10pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.2pt;
  color: var(--pine);
  margin: 0 0 5pt 0;
  padding-bottom: 1.5pt;
  border-bottom: 0.75pt solid var(--pine);
  break-after: avoid;
}
h4 { font-size: 9.5pt; margin: 6pt 0 1pt 0; text-transform: uppercase; break-after: avoid; }
p { margin: 0 0 4pt 0; orphans: 2; widows: 2; }
/* a role: TITLE  CITY / DATES, then the company line, then its bullets */
.role { margin: 6pt 0 0 0; break-after: avoid; }
h3 + .role { margin-top: 0; }
.role strong { text-transform: uppercase; color: var(--ink); }
.when { white-space: nowrap; margin-left: 6pt; font-style: italic; text-transform: uppercase; color: var(--grey); }
.side .when { display: block; margin: 1pt 0 0 0; }
.org { font-weight: 700; color: #3a3a3a; margin: 0 0 1pt 0; break-after: avoid; }
ul { margin: 1pt 0 4pt 0; padding-left: 0; list-style: none; }
/* the bullet is text in the line (hanging), so it is extracted with its item, not apart from it */
li { margin: 0 0 1pt 0; padding-left: 9pt; text-indent: -9pt; break-inside: avoid; }
.main li::before { content: "•\2002"; }
.side li { padding-left: 0; text-indent: 0; margin-bottom: 2pt; }
p:has(+ ul) { break-after: avoid; }
strong { font-weight: 700; color: var(--ink); }
a { color: var(--text); text-decoration: none; }
pre, code { font-family: inherit; white-space: pre-wrap; }
</style>
</head>
<body>
$body
</body>
</html>
