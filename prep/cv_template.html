<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>$title</title>
<!--
  The tailored CV as a PDF (prep/cvpdf.py fills $title and $body; $body is the CV's Markdown as
  escaped HTML). Built to be read by applicant tracking systems as well as people: one column in
  reading order, real text in a common font (selectable, no ligatures), headings as headings, no
  tables, images, columns, headers or footers carrying content. A4; a normal CV fits two pages.
-->
<style>
/* Colour: name and heading rules in matcha dust (#93a47a), headings #00545f, text dark grey.
   Colour sits on accents only; the text stays dark on white, so it prints well and parses the
   same as before. */
:root { --accent: #00545f; --ink: #3a3a3a; --muted: #5c5c5c; --rule: #93a47a; --name: #93a47a; }
@page {
  size: A4;
  margin: 16mm 18mm 16mm 18mm;
}
html {
  font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
  font-size: 10pt;
  line-height: 1.38;
  color: var(--ink);
  font-variant-ligatures: none;
  font-kerning: normal;
}
body { margin: 0; }
h2, h3, h4 { font-weight: 700; break-after: avoid; }
/* "# Name": the first heading is the candidate's name */
h2 {
  font-size: 21pt;
  line-height: 1.12;
  margin: 0 0 3pt 0;
  letter-spacing: 0.3pt;
  color: var(--name);
}
/* the line(s) under the name: contact details, then the title line in the accent colour */
h2 + p { margin: 0 0 3pt 0; color: var(--muted); }
h2 + p + p { margin: 0 0 6pt 0; color: var(--accent); font-weight: 700; font-size: 10.5pt; }
/* "## Summary", "## Experience": section headings */
h3 {
  font-size: 10.5pt;
  text-transform: uppercase;
  letter-spacing: 1pt;
  color: var(--accent);
  margin: 13pt 0 5pt 0;
  padding-bottom: 2.5pt;
  border-bottom: 1.25pt solid var(--rule);
}
h4 { font-size: 10pt; margin: 8pt 0 2pt 0; color: var(--ink); }
h5 { font-size: 10pt; margin: 6pt 0 2pt 0; color: var(--muted); }
p { margin: 0 0 5pt 0; orphans: 2; widows: 2; }
ul { margin: 2pt 0 7pt 0; padding-left: 0; list-style: none; }
/* the bullet is text in the line (hanging), so it is extracted with its item, not apart from it */
li { margin: 0 0 2pt 0; padding-left: 10pt; text-indent: -10pt; break-inside: avoid; }
li::before { content: "•\2002"; color: var(--accent); }
/* a role line ("**Senior Engineer — Company**, 2019–2024") stays with its bullets */
p:has(+ ul) { break-after: avoid; margin-bottom: 1pt; }
strong { font-weight: 700; color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
$body
</body>
</html>
